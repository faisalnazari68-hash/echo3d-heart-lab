name: Build Echo-3D Play Store bundle
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Fetch the live web app
        run: |
          mkdir -p www
          curl -fsSL https://echo3d-heart-lab.netlify.app/ -o www/index.html
          curl -fsSL https://echo3d-heart-lab.netlify.app/privacy -o www/privacy.html
          curl -fsSL https://echo3d-heart-lab.netlify.app/icon-512.png -o icon-512.png
          test -s www/index.html && grep -q angioLab www/index.html
      - name: Create Capacitor project
        run: |
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.premedfaze.echo3d","appName":"Echo-3D","webDir":"www"}
          EOF
          npm init -y >/dev/null
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap add android
          npx cap sync android
      - name: Icons
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
      - name: Set version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Sign bundle
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > upload.jks
          cp android/app/build/outputs/bundle/release/app-release.aab Echo-3D.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" -keypass "$KS_PASS" Echo-3D.aab echo3d
          jarsigner -verify Echo-3D.aab | head -3
          rm upload.jks
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-3D-aab
          path: Echo-3D.aab
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "aab-v${{ github.run_number }}" Echo-3D.aab --title "Echo-3D Play bundle (aab-v${{ github.run_number }})" --notes "Signed Android App Bundle for Google Play."
